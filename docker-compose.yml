# AlphaNode headless. `docker compose up -d node` runs the search; the live status page (leaderboard
# + progress) is at http://localhost:8787. Library/status/data persist in ./alphanode-data.
#
#   docker compose up -d --build node                 # start the search node
#   docker compose logs -f node                       # follow the search log
#   docker compose run --rm node top -n 20            # leaderboard in the terminal
#   docker compose run --rm node top --stats -n 10    # + maxDD/CAGR/sortino/calm/storm per row
#   docker compose run --rm node forward list         # forward track: paper equity per strategy
#   docker compose run --rm node fetch --top 150      # refresh Binance data (into the volume)
#   docker compose run --rm node portfolio --top 6    # build a combined portfolio -> state/portfolio.json
#   docker compose --profile signal up -d signal      # serve the top alpha's live signal on :8799
#
# The node steps the forward track itself (every 5 min, closed bars only) and shows it on the
# status page — no GUI needed anywhere. Disable with ALPHANODE_FORWARD: "0" below.
services:
  node:
    build: .
    image: alphanode:latest
    restart: unless-stopped
    ports:
      - "8787:8787"                       # status page -> http://localhost:8787
    volumes:
      - ./alphanode-data:/data            # library.jsonl, status.json, data.pickle persist here
      # to tune the FULL baseline (genome/GA/fitness/segments) without rebuilding, mount your own
      # config.ini over the one in the image:  cp evolution/config.ini ./config.ini  (then edit)
      # - ./config.ini:/app/evolution/config.ini:ro
    # --- CONFIGURE THE SEARCH HERE (each key overrides evolution/config.ini) ---
    # Values must be strings (quoted). Uncomment a line to change it from the config.ini default.
    environment:
      ALPHANODE_CPU_PERCENT: "50"         # 5..95 — share of CPU (workers = % x cores)
      ALPHANODE_UNIVERSE: "all"           # [universe] instruments — "all" or "BTCUSDT,ETHUSDT,..."
      ALPHANODE_POP: "200"                # [search] population
      ALPHANODE_GENS: "25"                # [search] generations
      ALPHANODE_STATUS_PORT: "8787"       # status page port (match the ports mapping above)
      # ALPHANODE_TARGET_VOL: "0.25"      # [simulation] target_vol
      # ALPHANODE_EXEC_COST: "0.001"      # [simulation] exec_cost (fee, fraction of turnover)
      # ALPHANODE_TRAIN_START: "2019-09-05"   # [segments] — TRAIN < VAL < TEST (TEST held out)
      # ALPHANODE_VAL_START:   "2021-11-01"
      # ALPHANODE_TEST_START:  "2023-01-01"
      # ALPHANODE_TEST_END:    "2026-07-05"
      # ALPHANODE_MAX_DEPTH: "8"          # [genome] max_depth   ·   ALPHANODE_MAX_SIZE: "40"
      # ALPHANODE_TOURNAMENT: "5"         # [ga] tournament / elitism / random_inject / crossover_prob
      # ALPHANODE_PARSIMONY: "0.010"      # [fitness] parsimony / corr_threshold / corr_penalty / hof_capacity
      # ALPHANODE_SEED: "7"               # RNG seed   ·   ALPHANODE_MAX_ROUNDS: "0" (0 = infinite)
    command: ["run"]

  # optional live-signal API (bound to 0.0.0.0 so it's reachable from the host).
  # start with:  docker compose --profile signal up -d signal
  signal:
    build: .
    image: alphanode:latest
    profiles: ["signal"]
    restart: unless-stopped
    ports:
      - "8799:8799"                       # signal API -> http://localhost:8799/signal
    volumes:
      - ./alphanode-data:/data
    environment:
      ALPHANODE_SIGNAL_HOST: "0.0.0.0"    # expose outside the container
    command: ["signal", "--rank", "1"]    # serve the current top-1 alpha (by fitness)
