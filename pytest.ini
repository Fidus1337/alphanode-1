[pytest]
testpaths = tests
addopts = -q
markers =
    gui: builds the real customtkinter App (needs a DISPLAY; skipped headless)
    slow: minutes, not seconds (Cython engine build, full A/B comparison)
    network: talks to the real internet (Binance, the live hub) — excluded by default
# network tests stay opt-in: run them with  pytest -m network
filterwarnings =
    ignore::DeprecationWarning
