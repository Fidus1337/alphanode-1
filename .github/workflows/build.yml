name: build-desktop

# Build of the AlphaNode desktop application: Windows (.exe + Inno Setup installer) and Linux (AppImage).
# Run manually (Actions -> build-desktop -> Run) or by pushing a vX.Y.Z tag (which also produces a Release).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# The hub the shipped app talks to. Its PUBLIC key is fetched from ${VAULT_API}/pub.txt (public,
# not a secret — do not commit the key, it is gitignored) and the URL is baked into the build
# stamp so EVERY platform — including the wrapper-less Windows .exe — knows where to activate.
# Change this one value to point a build at a different hub.
env:
  VAULT_API: https://api.alphanode.tech
  ALPHANODE_VAULT_URL: https://api.alphanode.tech

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt

      - name: Vault public key (from the live hub; public, gitignored)
        shell: bash
        run: curl -fsSL "$VAULT_API/pub.txt" -o alphanode/vault_server_key.pub

      - name: Icon
        run: python packaging/make_icon.py

      - name: Engine core -> native extensions (Cython)
        run: python packaging/cythonize_engine.py

      - name: Build stamp (provenance + hub URL)
        run: python packaging/make_build_stamp.py

      - name: PyInstaller (onedir)
        run: pyinstaller --noconfirm --clean --distpath packaging/dist --workpath packaging/build packaging/AlphaNode.spec

      - name: Selfcheck (frozen)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "packaging\dist\AlphaNode\AlphaNode.exe" `
               -ArgumentList "--role","selfcheck" `
               -WorkingDirectory "packaging\dist\AlphaNode" -Wait -PassThru
          if (Test-Path "packaging\dist\AlphaNode\selfcheck.log") {
            Get-Content "packaging\dist\AlphaNode\selfcheck.log"
          }
          if ($p.ExitCode -ne 0) { throw "selfcheck failed ($($p.ExitCode))" }

      # one real search round (multiprocessing pool inside a windowed frozen exe — the classic
      # Windows breakage) + the PDF analytics worker end-to-end via piped stdio
      - name: Smoke (frozen node round + PDF worker)
        run: python packaging/ci_smoke.py packaging/dist/AlphaNode/AlphaNode.exe

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path packaging/dist/AlphaNode/* -DestinationPath packaging/dist/AlphaNode-windows-portable.zip

      - name: Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\AlphaNode.iss

      - uses: actions/upload-artifact@v4
        with:
          name: alphanode-windows
          path: |
            packaging/dist/AlphaNode-windows-portable.zip
            packaging/Output/AlphaNode-Setup.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux
  linux:
    # PINNED, not -latest: PyInstaller bundles link against the build machine's glibc, so the
    # runner sets the OLDEST distro the AppImage can run on. 22.04 = glibc 2.35 — covers
    # Ubuntu 22.04+/Debian 12+ (verified in clean containers). -latest (24.04) would silently
    # raise the floor to glibc 2.39.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System libs (FUSE for AppImage, Tk for the build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 tk-dev

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt

      - name: Vault public key (from the live hub; public, gitignored)
        run: curl -fsSL "$VAULT_API/pub.txt" -o alphanode/vault_server_key.pub

      - name: Build AppImage
        env:
          PYTHON: python
          APPIMAGE_EXTRACT_AND_RUN: '1'      # runners without FUSE mounting -> extract-and-run
          # ALPHANODE_VAULT_URL comes from the workflow-level env: build_linux.sh bakes it into
          # AppRun, and make_build_stamp bakes it into the stamp (cross-platform channel).
        run: bash packaging/build_linux.sh

      - name: Selfcheck + smoke (frozen node round + PDF worker)
        run: |
          BIN=packaging/dist/AlphaNode/AlphaNode
          "$BIN" --role selfcheck || (cat packaging/dist/AlphaNode/selfcheck.log; exit 1)
          python packaging/ci_smoke.py "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: alphanode-linux
          path: packaging/dist/AlphaNode-x86_64.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------- Release (on tag)
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
